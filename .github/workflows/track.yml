name: 平安反转指标跟踪

on:
  schedule:
    # UTC 00:30 = 北京时间 08:30，周一 / 周三 / 周五
    # 注意：GitHub Actions 不保证准点，高峰期可能延迟 5-20 分钟，属正常现象
    - cron: '30 0 * * 1,3,5'
  workflow_dispatch:   # 允许在网页上手动点一次，方便验证

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 拉取数据并生成报告
        env:
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
          # 群机器人不能发文件附件，因此把报告发到 Pages，群里只发链接
          REPORT_PAGE_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          python3 tracker.py

      - name: 提交历史快照（供下期环比）
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.json reports/ || true
          git diff --quiet --cached && echo "无变更，跳过提交" || git commit -m "chore: 更新跟踪快照 $(date +'%Y-%m-%d')"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push || true

      - name: 上传报告
        uses: actions/upload-artifact@v4
        with:
          name: pingan-report-${{ github.run_number }}
          path: reports/
          retention-days: 90

      # 可选增强：群机器人不能发附件，把报告发到 Pages 后群里可点链接看完整版。
      # 私有仓库的 Pages 需付费版，失败不影响推送，故容错。
      - name: 发布在线报告（GitHub Pages）
        continue-on-error: true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages
          # 只清索引、保留工作区文件 —— 用 `git rm -rf .` 会连 reports/ 一起删掉，
          # 导致下一步 cp 无源文件、commit 空、push 静默失败（本步骤开了容错不易察觉）
          git rm -r --cached . >/dev/null 2>&1 || true
          # 发布全部历史报告（供群消息里的日期链接直达），并把最新一期作为首页
          cp reports/*.html .
          cp reports/latest.html index.html
          if [ ! -s index.html ]; then
            echo "::error::index.html 为空或不存在，终止发布"
            exit 1
          fi
          git add "*.html"
          git commit -m "docs: 更新在线报告 $(date +'%Y-%m-%d')"
          git push -f origin gh-pages
          echo "已发布文件：$(ls *.html | tr '\n' ' ')"
