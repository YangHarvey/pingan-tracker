name: 平安反转指标跟踪

on:
  schedule:
    # UTC 00:30 = 北京时间 08:30，周一 / 周三 / 周五
    # 注意：GitHub Actions 不保证准点，高峰期可能延迟 5-20 分钟，属正常现象
    - cron: '30 0 * * 1,3,5'
  workflow_dispatch:   # 允许在网页上手动点一次，方便验证

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 拉取数据并生成报告
        env:
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
        run: |
          python3 tracker.py

      - name: 提交历史快照（供下期环比）
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.json reports/ || true
          git diff --quiet --cached && echo "无变更，跳过提交" || git commit -m "chore: 更新跟踪快照 $(date +'%Y-%m-%d')"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push || true

      - name: 上传报告
        uses: actions/upload-artifact@v4
        with:
          name: pingan-report-${{ github.run_number }}
          path: reports/
          retention-days: 90
